<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found — Murat" />
  <meta name="theme-color" content="#fdfdfc" />
  <meta name="robots" content="noindex" />
  <title>404 — Murat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta property="og:title" content="404 — page not lost forever" />
  <meta property="og:description" content="The page you were looking for doesn't exist. Yet." />
  <meta property="og:image" content="https://muartdev.github.io/og.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    (() => {
      const t = localStorage.getItem("theme");
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f9f9f9;
      --bg-soft: #f2f1ef;
      --text: #080808;
      --text-soft: #646464;
      --muted: #888888;
      --line: rgba(0, 0, 0, 0.08);
      --line-2: rgba(0, 0, 0, 0.14);
      --orange: #e85002;
      --sans: "Geist", system-ui, -apple-system, sans-serif;
      --mono: "Geist Mono", ui-monospace, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #080808;
      --bg-soft: #121212;
      --text: #f9f9f9;
      --text-soft: #a7a7a7;
      --muted: #646464;
      --line: rgba(255, 255, 255, 0.06);
      --line-2: rgba(255, 255, 255, 0.14);
      --orange: #e85002;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background-color: var(--bg); color: var(--text); }
    body {
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }
    .mono { font-family: var(--mono); }
    a { color: inherit; text-decoration: none; }
    .frame {
      width: min(720px, 100%);
      text-align: center;
    }
    .crumbs {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .crumbs a:hover { color: var(--text); }
    .mosaic-404 {
      width: 100%;
      max-width: 480px;
      height: 220px;
      margin: 0 auto 12px;
      display: block;
      cursor: pointer;
      touch-action: pan-y;
    }
    .lede {
      font-size: 1.05rem;
      color: var(--text-soft);
      max-width: 38ch;
      margin: 0 auto 36px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 46px; padding: 0 24px; border-radius: 100px;
      font-size: 0.92rem; font-weight: 500;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
    }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line-2);
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow:
          0 0 0 3px rgba(255, 54, 21, 0.1),
          0 8px 24px -6px rgba(255, 54, 21, 0.45);
      }
      .btn-secondary:hover {
        transform: translateY(-2px);
        border-color: var(--text);
      }
    }
    .grid {
      position: fixed; inset: 0;
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 48px 48px;
      mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .frame { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame">
    <p class="crumbs"><a href="/">muartdev.github.io</a> &nbsp;/&nbsp; <span id="crumbText">not found</span></p>
    <canvas id="mosaic404" class="mosaic-404" role="img" aria-label="404"></canvas>
    <p class="lede" id="ledeText">This page slipped through the build pipeline. Or it never shipped.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/" id="homeBtn">Take me home</a>
      <a class="btn btn-secondary" href="mailto:muartmac@gmail.com" id="mailBtn">Get in touch</a>
    </div>
  </div>
  <script>
    (() => {
      try {
        if (localStorage.getItem("lang") === "tr") {
          document.documentElement.lang = "tr";
          document.getElementById("crumbText").textContent = "bulunamadı";
          document.getElementById("ledeText").textContent = "Aradığın sayfa taşınmış ya da hiç yayına alınmamış olabilir.";
          document.getElementById("homeBtn").textContent = "Ana sayfaya dön";
          document.getElementById("mailBtn").textContent = "İletişime geç";
        }
      } catch (e) {}

      const canvas = document.getElementById("mosaic404");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const GLYPHS = [
        [0xff,0x81,0xbd,0xa5,0xa5,0xbd,0x81,0xff],
        [0x80,0xc0,0xe0,0xf0,0xf8,0xd0,0x98,0x08],
        [0x7e,0x81,0xa5,0x81,0x99,0xa5,0x81,0x7e],
        [0xfe,0x92,0x92,0xfe,0x82,0xba,0xba,0xfe],
        [0x3c,0x66,0x06,0x1c,0x18,0x00,0x18,0x18],
        [0x66,0x99,0x66,0x3c,0x3c,0x66,0x99,0x66],
        [0xaa,0x55,0xaa,0x55,0xaa,0x55,0xaa,0x55],
        [0x38,0xfe,0x82,0xaa,0xaa,0xaa,0x82,0x7c]
      ];
      const COLORS = ["#e85002","#f16001","#c10801","#b95118","#d9c3ab","#333333","#262626","#e85002"];
      let width = 0, height = 0, dpr = 1, tiles = [];
      const pointer = { x: -9999, y: -9999, active: false };

      function build(scatter) {
        const r = canvas.getBoundingClientRect();
        width = Math.max(260, Math.round(r.width));
        height = Math.max(160, Math.round(r.height));
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;

        const cols = 32, rows = 16;
        const size = Math.max(8, Math.min(12, Math.floor((width * 0.84) / cols)));
        const ox = Math.round((width - cols * size) / 2);
        const oy = Math.round((height - rows * size) / 2);

        const off = document.createElement("canvas");
        off.width = cols; off.height = rows;
        const octx = off.getContext("2d");
        octx.fillStyle = "#fff";
        octx.font = "900 " + Math.round(rows * 0.82) + "px Geist, system-ui, sans-serif";
        octx.textAlign = "center";
        octx.textBaseline = "middle";
        octx.fillText("404", cols * 0.5, rows * 0.54);
        const data = octx.getImageData(0, 0, cols, rows).data;

        const next = [];
        let idx = 0;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (data[(y * cols + x) * 4 + 3] > 80) {
              const tx = ox + x * size, ty = oy + y * size;
              const prev = tiles[idx];
              next.push({
                x: prev ? prev.x : tx + (Math.random() - 0.5) * 36,
                y: prev ? prev.y : ty + (Math.random() - 0.5) * 36,
                vx: scatter ? (Math.random() - 0.5) * 12 : 0,
                vy: scatter ? (Math.random() - 0.5) * 12 : 0,
                tx, ty, size,
                color: COLORS[(x + y + idx) % COLORS.length],
                glyph: GLYPHS[idx % GLYPHS.length]
              });
              idx++;
            }
          }
        }
        tiles = next;
      }

      function tick() {
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          if (pointer.active) {
            const dx = t.x - pointer.x, dy = t.y - pointer.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < 3200 && d2 > 1) {
              const d = Math.sqrt(d2);
              t.vx += (dx / d) * ((56 - d) / 56) * 2.2;
              t.vy += (dy / d) * ((56 - d) / 56) * 2.2;
            }
          }
          t.vx = (t.vx + (t.tx - t.x) * 0.14) * 0.76;
          t.vy = (t.vy + (t.ty - t.y) * 0.14) * 0.76;
          t.x += t.vx; t.y += t.vy;
          const x = Math.round(t.x), y = Math.round(t.y), s = t.size;
          ctx.fillStyle = t.color;
          ctx.fillRect(x, y, s, s);
          ctx.fillStyle = "#fff";
          const pad = s >= 11 ? 2 : 1, px = (s - pad * 2) / 8;
          for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
              if ((t.glyph[r] >> (7 - c)) & 1) {
                ctx.fillRect(Math.round(x + pad + c * px), Math.round(y + pad + r * px), 1, 1);
              }
            }
          }
        }
        ctx.restore();
        requestAnimationFrame(tick);
      }

      canvas.addEventListener("pointermove", (e) => {
        const r = canvas.getBoundingClientRect();
        pointer.x = e.clientX - r.left;
        pointer.y = e.clientY - r.top;
        pointer.active = true;
      }, { passive: true });
      canvas.addEventListener("pointerleave", () => { pointer.active = false; }, { passive: true });
      canvas.addEventListener("click", () => build(true));
      window.addEventListener("resize", () => build(false), { passive: true });
      build(false);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
